name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.9.7"

jobs:
  lint:
    name: ${{ matrix.check.name }}
    runs-on: [self-hosted, Linux, ci-general]
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Ruff Format
            command: uv run ruff format --check .
          - name: Ruff Lint
            command: uv run ruff check --no-fix .
          - name: Pydocstyle
            command: uv run pydocstyle backend host
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas"), which fails
          # random jobs at checkout on this pool. A full fetch is immune.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Per-job UV_CACHE_DIR via GITHUB_ENV: job-level env cannot use the
        # runner context. Concurrent self-hosted jobs otherwise share
        # ~/.cache/uv; when a cache entry disappears mid-install, uv fails
        # with ENOENT while hardlinking into the venv. The matrix cells all
        # report the same GITHUB_JOB, so the cell index is part of the path.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_JOB}-${{ strategy.job-index }}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Even with a per-job UV_CACHE_DIR, prune --ci is unnecessary on
          # self-hosted and has raced with concurrent installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  test:
    name: Tests
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Isolate uv cache dir
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync

      # -n 4 --dist loadfile, not a serial run: parallel workers isolate each
      # test file into its own process, which is what surfaces environment
      # leakage between files. A serial run silently passes on that class of bug.
      - name: Pytest
        run: uv run pytest -n 4 --dist loadfile -q -m "not external and not dbtest"
