name: Staging lease aggregate diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Read anonymized aggregate lease statistics
    runs-on: [self-hosted, Linux, deploy-cloud-agent-control-staging]
    timeout-minutes: 5
    steps:
      - name: Read aggregate statistics without chat IDs or message details
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          probe="import asyncio,json,os\nimport asyncpg\nasync def main():\n    dsn=os.environ[\"AGENT_DATABASE_URL\"].replace(\"postgresql+asyncpg://\",\"postgresql://\").replace(\"postgresql+psycopg://\",\"postgresql://\")\n    c=await asyncpg.connect(dsn,timeout=10,command_timeout=30)\n    try:\n        async with c.transaction(readonly=True,isolation=\"repeatable_read\"):\n            common=\"\"\"WITH facts AS (\n            SELECT a.id,a.job_id,j.thread_id,a.host_id,a.lease_owner,a.status,a.started_at,\n              EXTRACT(EPOCH FROM a.finished_at-a.started_at) AS duration_s,\n              (a.lease_expires_at=a.started_at+interval '120 seconds') AS never_extended,\n              EXISTS(SELECT 1 FROM agent_job_events e WHERE e.attempt_id=a.id AND e.event_type='attempt_superseded' AND e.payload->>'reason'='lease_expired') AS lease_expired,\n              EXISTS(SELECT 1 FROM agent_job_events e WHERE e.attempt_id=a.id AND e.event_type IN ('message','tool_start','tool_result')) AS model_events,\n              EXISTS(SELECT 1 FROM agent_job_events e WHERE e.attempt_id=a.id AND e.event_type='lifecycle' AND e.payload->>'phase'='checked_out') AS checkout_events,\n              to_jsonb(a)->>'sandbox_runtime' AS sandbox_runtime,\n              (j.state='failed') AS failed\n            FROM agent_attempts a JOIN agent_jobs j ON j.id=a.job_id\n            ) \"\"\"\n            queries={\n              \"overall\": \"SELECT count(*) AS attempts,count(DISTINCT job_id) AS jobs,count(DISTINCT thread_id) AS chats,count(*) FILTER(WHERE lease_expired) AS expired_attempts,count(DISTINCT thread_id) FILTER(WHERE lease_expired) AS affected_chats,min(started_at) AS first_attempt,max(started_at) AS latest_attempt FROM facts\",\n              \"by_day\": \"SELECT started_at::date AS day,count(*) AS attempts,count(*) FILTER(WHERE lease_expired) AS expired,count(*) FILTER(WHERE failed) AS failed FROM facts GROUP BY 1 ORDER BY 1\",\n              \"by_worker\": \"SELECT host_id,lease_owner,count(*) AS attempts,count(*) FILTER(WHERE lease_expired) AS expired,min(started_at) FILTER(WHERE lease_expired) AS first_expired_task,max(started_at) FILTER(WHERE lease_expired) AS last_expired_task FROM facts GROUP BY 1,2 ORDER BY expired DESC,attempts DESC\",\n              \"failure_stages\": \"SELECT started_at::date AS day,host_id,lease_owner,sandbox_runtime,CASE WHEN model_events THEN 'model_started' WHEN checkout_events THEN 'checkout_done' ELSE 'before_checkout' END AS stage,never_extended,count(*) AS expired_attempts,count(DISTINCT thread_id) AS chats,round(avg(duration_s),3) AS avg_duration_s FROM facts WHERE lease_expired GROUP BY 1,2,3,4,5,6 ORDER BY 1,2,3\",\n              \"duration_bands\": \"SELECT CASE WHEN duration_s<30 THEN '<30s' WHEN duration_s<120 THEN '30-120s' WHEN duration_s<300 THEN '120-300s' ELSE '>=300s_or_active' END AS band,count(*) AS attempts,count(*) FILTER(WHERE lease_expired) AS expired FROM facts GROUP BY 1 ORDER BY 1\"\n            }\n            for name,q in queries.items():\n                rows=await c.fetch(common+q)\n                print(json.dumps({\"aggregate\":name,\"rows\":[dict(r) for r in rows]},default=str))\n    finally:await c.close()\ntry:asyncio.run(main())\nexcept Exception as e:print(json.dumps({\"error_type\":type(e).__name__}))\n"
          p=subprocess.run(["docker","ps","-q","--filter","label=com.docker.compose.project=cloudagent","--filter","label=com.docker.compose.service=control-plane"],capture_output=True,text=True,check=True)
          ids=p.stdout.split()
          if len(ids)!=1:raise RuntimeError("Expected one staging control-plane")
          subprocess.run(["docker","exec","-i",ids[0],"python","-"],input=probe,text=True,check=True,timeout=120)
          
          PY
