name: Staging lease aggregate diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    name: Read anonymized aggregate lease statistics
    runs-on: [self-hosted, Linux, deploy-cloud-agent-control-staging]
    timeout-minutes: 5
    steps:
      - name: Read aggregate statistics without chat IDs or message details
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          probe="import asyncio,json,os\nimport asyncpg\nasync def main():\n    dsn=os.environ[\"AGENT_DATABASE_URL\"].replace(\"postgresql+asyncpg://\",\"postgresql://\").replace(\"postgresql+psycopg://\",\"postgresql://\")\n    c=await asyncpg.connect(dsn,timeout=10,command_timeout=30)\n    try:\n        async with c.transaction(readonly=True,isolation=\"repeatable_read\"):\n            rows=await c.fetch(\"WITH expired AS (\\n SELECT a.*,dense_rank() OVER(ORDER BY j.thread_id) AS anonymous_chat\\n FROM agent_attempts a JOIN agent_jobs j ON j.id=a.job_id\\n WHERE EXISTS(SELECT 1 FROM agent_job_events e WHERE e.attempt_id=a.id AND e.event_type='attempt_superseded' AND e.payload->>'reason'='lease_expired')\\n)\\nSELECT a.started_at, a.lease_owner, a.anonymous_chat,\\n round(EXTRACT(EPOCH FROM a.finished_at-a.started_at),3) AS duration_s,\\n round(EXTRACT(EPOCH FROM a.lease_expires_at-a.started_at),3) AS lease_expiry_after_start_s,\\n count(e.id) FILTER(WHERE e.event_type='error') AS recorded_errors,\\n count(e.id) FILTER(WHERE e.event_type='error' AND e.payload::text ~* 'timeout|timed out|exceeded') AS error_timeout_mentions,\\n count(e.id) FILTER(WHERE e.event_type='error' AND e.payload::text ~* 'agent exited|exit code|setup failed|permission|denied') AS error_execution_mentions,\\n count(e.id) FILTER(WHERE e.event_type='error' AND e.payload::text ~* 'HTTP|503|502|connection|connecterror|readtimeout') AS error_transport_mentions,\\n count(e.id) FILTER(WHERE e.event_type='lifecycle' AND e.payload->>'phase'='cancelled_by_owner') AS owner_cancel_events,\\n count(e.id) FILTER(WHERE e.event_type='tool_result' AND e.payload->>'is_error'='true') AS tool_error_events,\\n count(e.id) FILTER(WHERE (e.event_type IN ('result','done','completed','failed','cancelled','turn_completed','turn_failed') OR (e.event_type='lifecycle' AND e.payload->>'phase'='result'))) AS terminal_named_events,\\n count(e.id) FILTER(WHERE e.event_type IN ('message','tool_start','tool_result','tool_progress')) AS agent_activity_events,\\n count(e.id) FILTER(WHERE e.event_type='lifecycle' AND e.payload->>'phase'='checked_out') AS checkout_events,\\n round(EXTRACT(EPOCH FROM max(e.created_at) FILTER(WHERE e.event_type!='attempt_superseded')-a.started_at),3) AS last_pre_expiry_event_after_start_s\\nFROM expired a LEFT JOIN agent_job_events e ON e.attempt_id=a.id\\nGROUP BY a.id,a.started_at,a.finished_at,a.lease_expires_at,a.lease_owner,a.anonymous_chat ORDER BY a.started_at\")\n            print(json.dumps({\"diagnostic\":\"expired_attempt_error_flags\",\"rows\":[dict(r) for r in rows]},default=str))\n    finally:await c.close()\ntry:asyncio.run(main())\nexcept Exception as e:print(json.dumps({\"error_type\":type(e).__name__}))\n"
          p=subprocess.run(["docker","ps","-q","--filter","label=com.docker.compose.project=cloudagent","--filter","label=com.docker.compose.service=control-plane"],capture_output=True,text=True,check=True)
          ids=p.stdout.split()
          if len(ids)!=1:raise RuntimeError("Expected one staging control-plane")
          subprocess.run(["docker","exec","-i",ids[0],"python","-"],input=probe,text=True,check=True,timeout=120)
          
          PY
