# Custom labels of the self-hosted runner pools, so actionlint's runner-label
# check can vet runs-on values instead of erroring on every custom label.
self-hosted-runner:
  labels:
    - ci-general
    - image-verify-x64
    - image-verify-arm64
    - deploy-cloud-agent-control-staging
    - deploy-cloud-agent-control-prod
    - deploy-cloud-agent-sandbox-staging
    - deploy-cloud-agent-sandbox-prod
