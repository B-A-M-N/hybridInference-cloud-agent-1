# Serving the cloud agent on its own origin, on the gateway's hostname.
#
#   https://<host>:8443/api/*  → this repository's control plane
#   https://<host>:8443/*      → this repository's web app
#
# **A whole `server { }` block, not an include.** This listens on its own port,
# which the browser counts as part of the origin — `https://host` and
# `https://host:8443` are two origins, and script on one cannot read the
# other's `sessionStorage` or reach into its DOM.
#
# ## Why a port and not a path
#
# Mounting this under the gateway's `/agents` was the earlier shape and it is
# not safe here. The gateway keeps its access token in `sessionStorage`, which
# is scoped to an origin and nothing finer: a path prefix is not a boundary,
# so the agent app would have been able to read the gateway's token directly.
# That matters more here than it usually would, because this app renders model
# output and live terminal contents — untrusted bytes are its normal input.
#
# A subdomain would be the conventional answer and is not available on this
# deployment, so the port carries the separation instead. It costs nothing:
# the certificate already covers this hostname, and no DNS record is involved.
#
# ## What a port does not separate
#
# **Cookies ignore the port** (RFC 6265, §8.5 — "cookies do not provide
# isolation by port"). The gateway's `refresh_token` cookie is set with
# `Path=/` on this same hostname, so the browser attaches it to requests here
# too. It is `HttpOnly`, so this app cannot *read* it, but the control plane
# receives it on every call.
#
# Closing that half is a gateway-side change — narrowing the cookie's `Path`
# to the auth routes that actually read it — and it is tracked separately. Do
# not read this file as claiming the cookie is contained; it is not.
#
# ## Applying it
#
# **Nothing in this repository applies this file.** The proxy in front of these
# hosts is not version-controlled anywhere; this is the reviewed text an
# operator pastes. Kept here so the routing can be read and argued with.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    # The gateway's own hostname and its existing certificate. The origin is
    # different because the port is; the name and the cert are unchanged, and
    # that is what makes this cost no DNS record.
    server_name staging.freeinference.org;

    ssl_certificate     /etc/letsencrypt/live/staging.freeinference.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.freeinference.org/privkey.pem;

    # The control plane. Everything the browser calls, plus the SSE stream.
    location /api/ {
        # **The trailing slash on both sides is what strips the prefix.**
        # `proxy_pass http://host:8000/` replaces the matched `/api/` with
        # `/`, so `/api/v1/agent/jobs` arrives as `/v1/agent/jobs`. Drop
        # either slash and nginx forwards the prefix intact, which the control
        # plane answers with 404 for every route — the failure looks like the
        # service is down rather than like a proxy misconfiguration.
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # **Server-sent events.** Job output streams over SSE, and with
        # buffering on, nginx holds the response until its buffer fills or the
        # request ends — so the agent's output arrives in one lump when the job
        # finishes, or never. The symptom is a run that looks hung while it is
        # working fine, which is indistinguishable from the sandbox being
        # stuck.
        proxy_buffering off;
        proxy_cache off;
        # nginx's own signal for the same thing, honoured even where a
        # downstream module re-enables buffering.
        proxy_set_header X-Accel-Buffering no;
        # A stream is idle between events by design. The default 60s read
        # timeout closes a healthy connection during a long tool call; the
        # client then reconnects and replays, which works but doubles the work
        # every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The web app, at the root of this origin. `NEXT_PUBLIC_BASE_PATH` is empty
    # for this shape, so Next generates unprefixed links and asset URLs and the
    # path is forwarded unchanged.
    location / {
        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next's dev overlay and any future websocket transport.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
